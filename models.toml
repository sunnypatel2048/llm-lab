# Model registry. Code refers to models by alias (e.g. "gemini-flash"), never by vendor ID,
# so swapping a model version is a one-line change here.
#
# Prices are USD per 1M tokens at the provider's PAID rates, even on the free tier,
# so cost_usd answers "what would this cost in production?".
# rpm / rpd = requests per minute / per day. Omit them for no limit (local models).
# Optional per model:
#   timeout_s        seconds per attempt (default 60, set in the client)
#   retry_on_timeout retry after a timeout? default true; false for local models, where a slow
#                    generation is just as slow the second time
#   reasoning_effort sent to the provider as-is when set (e.g. "none" turns thinking off on
#                    Ollama for models that only support on/off)

[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"

[providers.ollama]
base_url = "http://localhost:11434/v1"
# No api_key_env: Ollama ignores the key.

[models.gemini-flash]
provider = "gemini"
model_id = "gemini-3.8-flash"
price_in_per_m = 0.75   # rises to 1.50 on 2027-01-01
price_out_per_m = 3.75  # rises to 7.50 on 2027-01-01
rpm = 5
rpd = 20

[models.gemini-lite]
provider = "gemini"
model_id = "gemini-3.5-flash-lite"
price_in_per_m = 0.30
price_out_per_m = 2.50
rpm = 15
rpd = 500

[models.groq-oss]
provider = "groq"
model_id = "openai/gpt-oss-20b"
price_in_per_m = 0.075
price_out_per_m = 0.30
rpm = 30
rpd = 1000

[models.local-qwen]
provider = "ollama"
model_id = "qwen3.5:4b"
price_in_per_m = 0.0
price_out_per_m = 0.0
timeout_s = 300         # thinking on a laptop: a long answer can take minutes
retry_on_timeout = false

# Same model with thinking turned off: compare speed and quality against local-qwen.
[models.local-qwen-nothink]
provider = "ollama"
model_id = "qwen3.5:4b"
price_in_per_m = 0.0
price_out_per_m = 0.0
timeout_s = 120
retry_on_timeout = false
reasoning_effort = "none"
